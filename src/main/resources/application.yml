server:
  port: 8081

spring:
  r2dbc:
    url: r2dbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:person_db}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
  sql:
    init:
      mode: always

jwt:
  secret: ${JWT_SECRET:change-this-secret-change-this-secret-32bytes}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

webclient:
  bootcamp: ${WEBCLIENT_BOOTCAMP:http://localhost:8082/api/v1/bootcamps}
  report: ${WEBCLIENT_REPORT:http://localhost:8085/api/v1/reports/bootcamps}

admin:
  email: ${ADMIN_EMAIL:admin@pragma.com}
  password: ${ADMIN_PASSWORD:Admin123*}

appDescription: "Pragma Reactive Person"
appVersion: "1.0.0"
